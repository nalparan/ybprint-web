<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>청년인쇄사 관리자 센터</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Pretendard Variable", Pretendard, sans-serif; background-color: #F2F4F6; color: #191F28; letter-spacing: -0.02em; }
    .font-mono-code { font-family: 'Fira Code', monospace; }
    
    /* 엑셀 원본 출력용 스타일 */
    .quote-paper { background: #FFFFFF; font-family: 'Malgun Gothic', "Pretendard Variable", sans-serif; color: #000000; border: 1px solid #d1d5db; padding: 40px; box-shadow: 0 4px 25px rgba(0,0,0,0.05); margin: 0 auto; max-width: 800px; }
    .excel-table { border: 1.5px solid #000; border-collapse: collapse; width: 100%; margin-bottom: 12px; }
    .excel-table th, .excel-table td { border: 1px solid #333; padding: 6px 8px; font-size: 11px; }
    .excel-table th { background-color: #f1f5f9; text-align: center; font-weight: bold; }
    
    /* 직인(도장) 효과 CSS */
    .stamp-seal {
      position: absolute; top: -10px; left: 35px; width: 36px; height: 36px;
      border: 2px solid #dc2626; border-radius: 50%; color: #dc2626;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 900; transform: rotate(-10deg);
      background-color: rgba(255,255,255,0.6); mix-blend-mode: multiply; user-select: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- 상단 네비게이션 바 -->
  <header class="bg-white/95 border-b border-[#E5E8EB] px-4 py-3 sm:h-20 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <img src="/favicon.png" alt="로고" class="w-10 h-10 rounded-2xl border p-1 bg-white shrink-0">
      <div>
        <h1 class="font-extrabold text-lg text-[#191F28]">청년인쇄사 <span class="text-[10px] font-mono-code bg-[#E8F3FF] text-[#1B64DA] border px-2 py-0.5 rounded-full ml-1">ADMIN</span></h1>
        <p class="text-[12px] text-[#8B95A1] font-medium">실시간 견적 문의 현황판</p>
      </div>
    </div>
    <button onclick="fetchInquiries()" class="flex items-center gap-1.5 px-3 py-2 bg-[#3182F6] text-white rounded-xl text-xs font-bold shadow-md">
      <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>새로고침
    </button>
  </header>

  <!-- 메인 대시보드 -->
  <main class="flex-1 w-full px-4 sm:px-[5vw] py-6 space-y-6">
    <div class="bg-white border border-[#E5E8EB] rounded-3xl overflow-hidden shadow-xs w-full">
      <div class="p-5 border-b flex justify-between items-center">
        <h2 class="text-xl font-extrabold text-[#191F28]">접수 내역</h2>
      </div>
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left border-collapse min-w-[1000px]">
          <thead>
            <tr class="bg-[#F9FAFB] text-[#6B7684] text-[13px] font-bold border-b">
              <th class="py-4 pl-6 pr-3 w-16 text-center">NO</th>
              <th class="py-4 px-4 w-36">접수 시간</th>
              <th class="py-4 px-5 w-48">소속 / 성함</th>
              <th class="py-4 px-4 w-44">연락처</th>
              <th class="py-4 px-5">문의 및 요청사항</th>
              <th class="py-4 pl-3 pr-7 text-center w-[120px]">관리</th>
            </tr>
          </thead>
          <tbody id="inquiry-table-body" class="divide-y text-[14px]">
            <tr><td colspan="6" class="py-12 text-center text-[#8B95A1]">서버에서 데이터를 불러오고 있습니다...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 견적 발송 메인 모달 -->
  <div id="quote-modal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-5xl rounded-3xl flex flex-col shadow-2xl h-[90vh] overflow-hidden">
      
      <!-- 모달 헤더 -->
      <div class="p-5 border-b flex justify-between items-center bg-white shrink-0">
        <h3 class="font-extrabold text-lg flex items-center gap-2"><i data-lucide="calculator" class="w-5 h-5 text-blue-500"></i>청년인쇄사 자동 견적 엔진</h3>
        <button onclick="closeQuoteModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex justify-center items-center">✕</button>
      </div>

      <!-- 상단 단계 네비게이션 탭 -->
      <div class="flex items-center px-6 py-3 bg-gray-50 border-b shrink-0 select-none">
        <div onclick="goToStep(1)" class="flex-1 flex items-center cursor-pointer">
          <div id="step-dot-1" class="w-7 h-7 rounded-full bg-blue-500 text-white flex justify-center items-center font-bold text-xs">1</div>
          <span id="step-text-1" class="ml-2 font-bold text-gray-900 text-sm">① 자동견적작성</span><div class="flex-1 h-px bg-gray-200 mx-3"></div>
        </div>
        <div onclick="goToStep(2)" class="flex-1 flex items-center cursor-pointer">
          <div id="step-dot-2" class="w-7 h-7 rounded-full bg-gray-200 text-gray-500 flex justify-center items-center font-bold text-xs">2</div>
          <span id="step-text-2" class="ml-2 font-bold text-gray-500 text-sm">② 견적검증(3종 엑셀뷰)</span><div class="flex-1 h-px bg-gray-200 mx-3"></div>
        </div>
        <div onclick="goToStep(3)" class="flex-1 flex items-center cursor-pointer">
          <div id="step-dot-3" class="w-7 h-7 rounded-full bg-gray-200 text-gray-500 flex justify-center items-center font-bold text-xs">3</div>
          <span id="step-text-3" class="ml-2 font-bold text-gray-500 text-sm">③ 고객 발송 & 다운로드</span>
        </div>
      </div>

      <!-- 모달 바디 -->
      <div class="flex-1 overflow-y-auto p-6 bg-gray-50 relative">
        
        <!-- STEP 1: 입력 화면 -->
        <div id="step1-container" style="display: block;">
          <div class="flex gap-4 mb-4">
            <div class="flex-1 bg-white p-4 rounded-xl border">
              <label class="text-xs font-bold text-gray-500 block mb-1">수신 기관 (고객명)</label>
              <input type="text" id="input-org" class="w-full text-sm font-bold border rounded-lg px-3 py-2 bg-gray-50" readonly>
              <input type="hidden" id="input-phone">
            </div>
            <div class="w-48 bg-white p-4 rounded-xl border">
              <label class="text-xs font-bold text-gray-500 block mb-1">총 제작 부수 (권)</label>
              <input type="number" id="input-qty" value="100" class="w-full text-sm font-bold border rounded-lg px-3 py-2 font-mono-code" oninput="onTemplateChange()">
            </div>
            <div class="w-48 bg-white p-4 rounded-xl border">
              <label class="text-xs font-bold text-gray-500 block mb-1">원고 분석 페이지</label>
              <input type="number" id="input-page" value="26" class="w-full text-sm font-bold border rounded-lg px-3 py-2 font-mono-code" oninput="onTemplateChange()">
            </div>
            <div class="flex-1 bg-white p-4 rounded-xl border">
              <label class="text-xs font-bold text-gray-500 block mb-1">3종 엑셀 서식 선택</label>
              <select id="input-template" class="w-full text-sm font-bold border rounded-lg px-3 py-2 text-blue-700 bg-blue-50 border-blue-200 focus:outline-none focus:ring-2" onchange="onTemplateChange()">
                <option value="디지탈상세">🏛️ 디지탈상세 (인재개발원형 - 4열)</option>
                <option value="디지털일반">📄 디지털일반 (글로벌리서치형 - 7열)</option>
                <option value="옵셋일반">🖨️ 옵셋일반 (비즈쿡형 - 7열 관리비포함)</option>
              </select>
            </div>
          </div>

          <div class="bg-white p-5 rounded-xl border">
            <div class="flex justify-between items-center mb-3">
              <h4 class="text-sm font-bold">세부 산출 내역</h4>
              <button onclick="addEmptyRow()" class="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold border border-blue-200">+ 직접 추가</button>
            </div>
            
            <div class="overflow-x-auto border rounded-lg mb-4">
              <table class="w-full text-left min-w-[700px]">
                <thead class="bg-gray-50 text-xs font-bold border-b">
                  <tr>
                    <th class="py-2 px-2 text-center w-16">항목</th>
                    <th class="py-2 px-2 text-center w-20">내역</th>
                    <th class="py-2 px-2">산출식 / 규격</th>
                    <th class="py-2 px-2 text-center w-16">수량</th>
                    <th class="py-2 px-2 text-right w-20">단가(원)</th>
                    <th class="py-2 px-2 text-right w-24">공급가액</th>
                    <th class="py-2 px-2 w-28">비고</th>
                    <th class="py-2 px-2 text-center w-10">삭제</th>
                  </tr>
                </thead>
                <tbody id="quote-tbody" class="text-xs divide-y">
                  <!-- JS Data rows -->
                </tbody>
              </table>
            </div>
            
            <div class="bg-gray-50 border rounded-lg p-4 text-right space-y-1.5">
              <div class="text-xs font-bold text-gray-500">공급가액 소계: <span id="val-sub" class="w-32 inline-block font-mono-code text-gray-900">0</span></div>
              <div class="text-xs font-bold text-gray-500">부가가치세 (10%): <span id="val-vat" class="w-32 inline-block font-mono-code text-gray-900">0</span></div>
              <div class="text-lg font-black pt-2 border-t mt-2 text-gray-900">총 합계 (VAT포함): <span id="val-total" class="w-32 inline-block font-mono-code text-blue-600">0</span></div>
            </div>
          </div>
        </div>

        <!-- STEP 2: 3종 엑셀 실물 뷰 (인쇄 영역) -->
        <div id="step2-container" style="display: none;" class="pb-10">
          <div id="quote-printable-area" class="quote-paper">
            <!-- 엑셀 HTML이 여기에 1:1로 렌더링 됩니다 -->
          </div>
        </div>

        <!-- STEP 3: 완료 및 발송 -->
        <div id="step3-container" style="display: none;" class="text-center py-12">
          <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="send" class="w-8 h-8 text-blue-600"></i></div>
          <h3 class="text-xl font-bold mb-2">견적서 작성이 완료되었습니다!</h3>
          <p class="text-gray-500 text-sm mb-8">고객에게 이메일로 전송하거나 PDF로 저장할 수 있습니다.</p>
          
          <div class="flex justify-center gap-4">
            <button onclick="downloadPDF()" class="flex items-center gap-2 px-6 py-3 border-2 border-blue-600 text-blue-600 bg-white hover:bg-blue-50 rounded-xl font-bold transition-all">
              <i data-lucide="download" class="w-5 h-5"></i> PDF 저장하기
            </button>
            <button onclick="sendEmail()" id="btn-email" class="flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg transition-all">
              <i data-lucide="mail" class="w-5 h-5"></i> 고객 메일 발송
            </button>
          </div>
        </div>

      </div>

      <!-- 모달 하단 고정 버튼 -->
      <div class="p-4 border-t bg-white flex justify-between shrink-0">
        <button id="btn-prev" onclick="goToStep(currentQuoteStep - 1)" class="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-bold transition-colors" style="display: none;">이전 단계</button>
        <div class="flex-1"></div>
        <button id="btn-next" onclick="goToStep(currentQuoteStep + 1)" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md transition-colors" style="display: block;">다음 단계 (검증)</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const API_URL = "https://ybprint-backend-1.onrender.com/inquiries";
    let inquiries = [];
    let currentQuoteStep = 1;

    // 단가 기본값 세팅
    const PRICE = { bw: 50, cover: 1700, coat: 2200, bind: 3300 };

    async function fetchInquiries() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        inquiries = (Array.isArray(data) ? data : data.inquiries || []).reverse();
        renderTable();
      } catch(e) {
        document.getElementById('inquiry-table-body').innerHTML = `<tr><td colspan="6" class="text-center py-10 text-red-500">서버 접속 실패 (Render 부팅 대기중...)</td></tr>`;
      }
    }

    function renderTable() {
      const tbody = document.getElementById('inquiry-table-body');
      if(inquiries.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-gray-500">접수 내역이 없습니다.</td></tr>`;
        return;
      }
      tbody.innerHTML = inquiries.map((item, idx) => {
        const no = inquiries.length - idx;
        const time = item.timestamp || item.created_at || "-";
        const org = item.org || item.name || "고객";
        const phone = item.phone || "-";
        const text = item.inquiry || "내용 없음";
        
        // 페이지 자동 추출
        let pMatch = text.match(/(\d+)\s*p/i) || item.spec?.match(/(\d+)\s*p/i);
        let qMatch = text.match(/(\d+)\s*부/);
        let p = pMatch ? pMatch[1] : 26;
        let q = qMatch ? qMatch[1] : 100;

        return `
          <tr class="hover:bg-gray-50 border-b">
            <td class="py-4 text-center font-mono-code text-gray-500">${no}</td>
            <td class="py-4 px-4 font-mono-code text-xs">${time}</td>
            <td class="py-4 px-5 font-bold">${org}</td>
            <td class="py-4 px-4 font-mono-code text-blue-600">${phone}</td>
            <td class="py-4 px-5 text-gray-600 truncate max-w-[300px] text-sm">${text}</td>
            <td class="py-4 text-center">
              <button onclick="openQuoteModal('${encodeURIComponent(org)}', '${encodeURIComponent(phone)}', ${q}, ${p})" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-xs font-bold shadow-md">견적작성</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openQuoteModal(orgEnc, phoneEnc, qty, page) {
      document.getElementById('input-org').value = decodeURIComponent(orgEnc);
      document.getElementById('input-phone').value = decodeURIComponent(phoneEnc);
      document.getElementById('input-qty').value = qty;
      document.getElementById('input-page').value = page;
      
      onTemplateChange(); // 기본 디지탈상세 로드
      goToStep(1);
      document.getElementById('quote-modal').classList.remove('hidden');
    }

    function closeQuoteModal() {
      document.getElementById('quote-modal').classList.add('hidden');
    }

    // 1단계: 템플릿에 따른 초기 줄 생성
    function onTemplateChange() {
      const template = document.getElementById('input-template').value;
      const qty = parseInt(document.getElementById('input-qty').value) || 100;
      const page = parseInt(document.getElementById('input-page').value) || 26;
      const totalPages = qty * page;

      document.getElementById('quote-tbody').innerHTML = ''; // 초기화

      if (template === '디지탈상세') {
        const coverAndBind = PRICE.cover + PRICE.coat + PRICE.bind;
        const total = (totalPages * PRICE.bw) + (qty * coverAndBind);
        addRow('교재제작', '본문 및 제본', `[(( ${qty}부 x ${page}p) x ${PRICE.bw}원) + (${qty}부 x ${coverAndBind.toLocaleString()}원)]`, 1, total, '표지칼라/흑백/무선');
        addRow('기타', '배송', '관공서 직배송', 1, 0, '당일 배송');
      } 
      else if (template === '디지털일반') {
        addRow('기획', '-', '-', 0, 0, '');
        addRow('디자인', '-', '-', 0, 0, '');
        addRow('제작', '칼라출력', '표지', qty, PRICE.cover, '스노우250g/단면');
        addRow('제작', '흑백출력', '내지', totalPages, PRICE.bw, `${page}p x ${qty}부/모조80g`);
        addRow('제작', '코팅', '무광코팅', qty, PRICE.coat, '표지 단면');
        addRow('제작', '제본', '무선제본', qty, PRICE.bind, '무선 책제본');
        addRow('기타', '배송', '직배송', 1, 0, '');
      }
      else if (template === '옵셋일반') {
        addRow('기획', '-', '-', 0, 0, '');
        addRow('디자인', '-', '-', 0, 0, '');
        addRow('제작', '지대', '표지(0.5연)', 1, 77750, '스노우250');
        addRow('제작', '지대', '내지(3연)', 1, 220050, '모조80');
        addRow('제작', 'CTP', '8판', 8, 18000, '4도/4도');
        addRow('제작', '인쇄', '옵셋본인쇄', 8, 18000, '8도');
        addRow('제작', '코팅', '표지무광', qty, PRICE.coat, '단면');
        addRow('제작', '제본', '무선제본', qty, PRICE.bind, '');
        addRow('제작', '일반관리비', '12% (지대제외)', 1, 0, '자동계산');
        addRow('기타', '배송', '직배송', 1, 0, '');
      }
      calculateAll();
    }

    function addRow(type, name, desc, q, p, rem) {
      const tr = document.createElement('tr');
      tr.className = "row-item";
      tr.innerHTML = `
        <td class="p-1"><input type="text" class="i-type w-full border rounded p-1.5 text-center text-xs" value="${type}" oninput="calculateAll()"></td>
        <td class="p-1"><input type="text" class="i-name w-full border rounded p-1.5 text-center text-xs font-bold" value="${name}" oninput="calculateAll()"></td>
        <td class="p-1"><input type="text" class="i-desc w-full border rounded p-1.5 text-xs font-mono-code" value="${desc}" oninput="calculateAll()"></td>
        <td class="p-1"><input type="number" class="i-qty w-full border rounded p-1.5 text-center text-xs font-mono-code" value="${q}" oninput="calculateAll()"></td>
        <td class="p-1"><input type="number" class="i-price w-full border rounded p-1.5 text-right text-xs font-mono-code" value="${p}" oninput="calculateAll()"></td>
        <td class="p-1"><input type="text" class="i-amt w-full bg-gray-100 border rounded p-1.5 text-right text-xs font-bold font-mono-code" readonly></td>
        <td class="p-1"><input type="text" class="i-rem w-full border rounded p-1.5 text-xs text-gray-500" value="${rem}" oninput="calculateAll()"></td>
        <td class="p-1 text-center"><button class="text-red-400 hover:text-red-600 font-bold" onclick="this.closest('tr').remove(); calculateAll()">✕</button></td>
      `;
      document.getElementById('quote-tbody').appendChild(tr);
    }
    
    function addEmptyRow() { addRow('기타','직접입력','', 1, 0, ''); calculateAll(); }

    // 데이터 계산 및 2단계 실시간 렌더링
    function calculateAll() {
      const template = document.getElementById('input-template').value;
      let subtotal = 0;
      let excludingMaterial = 0;
      const rows = [];

      document.querySelectorAll('.row-item').forEach(tr => {
        const type = tr.querySelector('.i-type').value;
        const name = tr.querySelector('.i-name').value;
        const desc = tr.querySelector('.i-desc').value;
        const qty = Number(tr.querySelector('.i-qty').value) || 0;
        let price = Number(tr.querySelector('.i-price').value) || 0;
        
        // 옵셋일반: 일반관리비 12% 로직
        if(template === '옵셋일반' && name === '일반관리비') {
          price = Math.round(excludingMaterial * 0.12);
          tr.querySelector('.i-price').value = price;
        }

        const amt = qty * price;
        tr.querySelector('.i-amt').value = amt.toLocaleString();
        subtotal += amt;
        
        if (name !== '지대' && name !== '일반관리비') {
          excludingMaterial += amt;
        }

        rows.push({ type, name, desc, qty, price, amt, rem: tr.querySelector('.i-rem').value });
      });

      const vat = Math.floor(subtotal * 0.1);
      const total = subtotal + vat;

      document.getElementById('val-sub').innerText = subtotal.toLocaleString() + " 원";
      document.getElementById('val-vat').innerText = vat.toLocaleString() + " 원";
      document.getElementById('val-total').innerText = total.toLocaleString() + " 원";

      // 여기서 2단계 화면을 무조건 새로 그림
      renderStep2Excel(template, rows, subtotal, total);
    }

    // 한글 금액 표기 함수
    function numToKor(n) {
      if(!n) return "영";
      const u=["","만 ","억 ","조 "], su=["","십","백","천"], d=["","일","이","삼","사","오","육","칠","팔","구"];
      let r="", c=0;
      while(n>0){
        let m=n%10000, s="";
        for(let i=0; i<4; i++){ let di=m%10; if(di>0) s=d[di]+su[i]+s; m=Math.floor(m/10); }
        if(s) r=s+u[c]+r; c++; n=Math.floor(n/10000);
      }
      return r.trim();
    }

    // 디스플레이 토글 로직 (절대 먹통 방지)
    function goToStep(step) {
      if(step < 1 || step > 3) return;
      currentQuoteStep = step;
      
      document.getElementById('step1-container').style.display = (step === 1) ? 'block' : 'none';
      document.getElementById('step2-container').style.display = (step === 2) ? 'block' : 'none';
      document.getElementById('step3-container').style.display = (step === 3) ? 'block' : 'none';
      
      document.getElementById('btn-prev').style.display = (step === 1) ? 'none' : 'block';
      document.getElementById('btn-next').style.display = (step === 3) ? 'none' : 'block';

      // 상단 배지 UI 업데이트
      [1,2,3].forEach(i => {
        const dot = document.getElementById(`step-dot-${i}`);
        const txt = document.getElementById(`step-text-${i}`);
        if(i === step) { 
          dot.className="w-7 h-7 rounded-full bg-blue-500 text-white flex justify-center items-center font-bold text-xs"; 
          txt.className="ml-2 font-bold text-gray-900 text-sm"; 
        } else if(i < step) { 
          dot.className="w-7 h-7 rounded-full bg-green-500 text-white flex justify-center items-center font-bold text-xs"; 
          dot.innerHTML="✓"; 
          txt.className="ml-2 font-bold text-gray-900 text-sm"; 
        } else { 
          dot.className="w-7 h-7 rounded-full bg-gray-200 text-gray-500 flex justify-center items-center font-bold text-xs"; 
          dot.innerHTML=i; 
          txt.className="ml-2 font-bold text-gray-500 text-sm"; 
        }
      });
    }

    // PDF 다운로드
    function downloadPDF() {
      const el = document.getElementById('quote-printable-area');
      const org = document.getElementById('input-org').value;
      const opt = { 
        margin: [15, 10, 15, 10], 
        filename: `견적서_${org}_청년인쇄사.pdf`, 
        image: {type:'jpeg', quality:1}, 
        html2canvas: {scale: 2}, 
        jsPDF: {unit:'mm', format:'a4'} 
      };
      html2pdf().set(opt).from(el).save();
    }

    // 이메일 발송 API
    async function sendEmail() {
      const btn = document.getElementById('btn-email');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 발송중...`;
      lucide.createIcons();

      const html = document.getElementById('quote-printable-area').outerHTML;
      const org = document.getElementById('input-org').value;
      const email = document.getElementById('input-phone').value;
      const toEmail = /[a-zA-Z@]/.test(email) ? email : 'admin@ybprint.co.kr';

      try {
        const res = await fetch('/api/send-estimate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to: toEmail, subject: `[청년인쇄사] ${org}님, 견적서 안내`, html: html })
        });
        if(res.ok) alert(`🎉 ${org}(${toEmail})님에게 견적서가 발송되었습니다.`);
        else alert('⚠️ 이메일 전송 실패. PDF 다운로드를 이용해주세요.');
      } catch(e) { alert('⚠️ 통신 오류 발생'); }
      finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="mail" class="w-5 h-5"></i> 고객 메일 발송`;
        lucide.createIcons();
      }
    }

    fetchInquiries();
