<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청년인쇄사 관리자 대시보드</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&family=Urbanist:wght@400;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
    }
    .font-urbanist { font-family: 'Urbanist', sans-serif; }
    .font-mono-code { font-family: 'Fira Code', monospace; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 lg:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- 상단 헤더 -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
      <div class="flex items-center gap-3.5">
        <!-- ① 파비콘 로고 적용 -->
        <img src="/favicon.png" alt="청년인쇄사 로고" class="w-10 h-10 rounded-xl object-contain shadow-xs border border-slate-200/80 p-1 bg-white">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-black text-slate-900 tracking-tight">청년인쇄사</h1>
            <span class="px-2 py-0.5 text-[11px] font-black font-urbanist bg-blue-50 text-blue-600 rounded-md border border-blue-200">ADMIN</span>
          </div>
          <p class="text-xs text-slate-500 font-medium mt-0.5">실시간 견적 문의 현황판</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 self-end sm:self-center">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-600">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="font-urbanist font-bold text-slate-700">Render Live</span>
        </div>
        <a href="/" class="p-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition shadow-xs" title="메인 웹사이트로 이동">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <button onclick="fetchInquiries()" class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition shadow-sm cursor-pointer">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="refresh-icon"></i>
          <span>새로고침</span>
        </button>
      </div>
    </header>

    <!-- 요약 통계 카드 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex justify-between items-start">
        <div class="space-y-1">
          <span class="text-xs font-semibold text-slate-500">오늘 접수</span>
          <div class="flex items-baseline gap-1">
            <span id="stat-today" class="text-3xl font-black font-urbanist text-slate-900">0</span>
            <span class="text-sm font-bold text-slate-600">건</span>
          </div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-100">
          <i data-lucide="inbox" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex justify-between items-start">
        <div class="space-y-1">
          <span class="text-xs font-semibold text-slate-500">원고 첨부</span>
          <div class="flex items-baseline gap-1">
            <span id="stat-file" class="text-3xl font-black font-urbanist text-emerald-600">0</span>
            <span class="text-sm font-bold text-slate-600">건</span>
          </div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100">
          <i data-lucide="file-text" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs flex justify-between items-start">
        <div class="space-y-1">
          <span class="text-xs font-semibold text-slate-500">서버 상태</span>
          <div class="flex items-center gap-2 pt-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <span id="stat-status" class="text-sm font-bold text-slate-900">정상 가동</span>
          </div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center border border-purple-100">
          <i data-lucide="server" class="w-5 h-5"></i>
        </div>
      </div>
    </div>

    <!-- 접수 내역 테이블 섹션 -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
      <div class="p-5 border-b border-slate-200/80 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div class="flex items-center gap-2">
          <h2 class="text-lg font-black text-slate-900">접수 내역</h2>
          <span id="badge-total-count" class="px-2 py-0.5 text-xs font-bold font-urbanist bg-blue-50 text-blue-600 rounded-md border border-blue-100">0건</span>
        </div>
        
        <div class="w-full sm:w-80 relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="소속, 연락처, 원고명 검색..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-xs font-medium focus:outline-none focus:bg-white focus:border-blue-500 transition">
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50/75 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider font-urbanist">
              <th class="py-3.5 px-4 w-14 text-center">NO</th>
              <th class="py-3.5 px-4 w-36">접수 시간</th>
              <th class="py-3.5 px-4 w-44">소속 / 성함</th>
              <th class="py-3.5 px-4 w-48">연락처</th>
              <th class="py-3.5 px-4 w-72">첨부 원고 / 규격</th>
              <th class="py-3.5 px-4 min-w-[200px]">문의 및 요청사항</th>
              <th class="py-3.5 px-4 w-28 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="inquiry-table-body" class="divide-y divide-slate-200/80 text-slate-700">
            <tr>
              <td colspan="7" class="py-16 text-center text-slate-400 font-medium">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-blue-600"></i>
                <span>실시간 접수 데이터를 불러오는 중입니다...</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 견적 작성 모달 -->
  <div id="quote-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-200 pb-3">
        <h3 class="text-base font-black text-slate-900">견적 안내 작성</h3>
        <button onclick="closeQuoteModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="font-bold text-slate-700 block mb-1">수신인 / 연락처</label>
          <input type="text" id="modal-recipient" readonly class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">확인된 사양 및 규격</label>
          <input type="text" id="modal-spec" readonly class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-800">
        </div>
        <div>
          <label class="font-bold text-slate-700 block mb-1">견적 금액 및 회신 메시지</label>
          <textarea id="modal-quote-content" rows="4" placeholder="예: 안녕하세요 청년인쇄사입니다. 요청하신 사양 기준 견적가는 부가세 포함 00,000원입니다." class="w-full bg-white border border-slate-300 rounded-xl p-3 focus:outline-none focus:border-blue-500 leading-relaxed"></textarea>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeQuoteModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition text-xs">취소</button>
        <button onclick="copyQuoteToClipboard()" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition text-xs flex items-center justify-center gap-1.5">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> 텍스트 복사
        </button>
      </div>
    </div>
  </div>

  <script>
    const RENDER_BACKEND_URL = "https://ybprint-backend-1.onrender.com";
    let allInquiries = [];

    async function fetchInquiries() {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const response = await fetch(`${RENDER_BACKEND_URL}/get-inquiries`, { method: 'GET', mode: 'cors' });
        if (response.ok) {
          const data = await response.json();
          allInquiries = Array.isArray(data) ? data : (data.inquiries || []);
          renderTable(allInquiries);
          updateStats(allInquiries);
        } else {
          showEmptyState("접수 데이터를 불러오지 못했습니다.");
        }
      } catch (err) {
        showEmptyState("서버 연결 대기 중입니다. 잠시 후 새로고침해 주세요.");
      } finally {
        if (refreshIcon) setTimeout(() => refreshIcon.classList.remove('animate-spin'), 600);
      }
    }

    function updateStats(list) {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayItems = list.filter(item => (item.created_at || '').startsWith(todayStr));
      const fileItems = list.filter(item => item.file_name && item.file_name !== '첨부파일 없음');

      document.getElementById('stat-today').innerText = todayItems.length || list.length;
      document.getElementById('stat-file').innerText = fileItems.length;
      document.getElementById('badge-total-count').innerText = `${list.length}건`;
    }

    function renderTable(list) {
      const tbody = document.getElementById('inquiry-table-body');
      if (!tbody) return;

      if (!list || list.length === 0) {
        showEmptyState("접수된 견적 문의 내역이 없습니다.");
        return;
      }

      tbody.innerHTML = list.map((item, idx) => {
        const no = String(list.length - idx).padStart(2, '0');
        const contactVal = item.phone || item.email || '-';
        const hasFile = item.file_name && item.file_name !== '첨부파일 없음';
        
        const fileDisplayHtml = hasFile ? `
          <div class="space-y-1">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg border border-blue-200/60 font-medium max-w-full truncate">
              <i data-lucide="file-text" class="w-3.5 h-3.5 shrink-0"></i>
              <span class="truncate">${item.file_name}</span>
            </div>
            <div class="text-[11px] text-slate-500 font-mono-code">${item.spec || '일반 사양'}</div>
          </div>
        ` : `
          <span class="text-slate-400 font-medium">첨부 원고 없음</span>
        `;

        return `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="py-4 px-4 text-center font-bold font-urbanist text-slate-400">${no}</td>
            <td class="py-4 px-4 font-mono-code text-slate-600">${item.created_at || '2026-08-22 05:15:55'}</td>
            <td class="py-4 px-4 font-bold text-slate-900">${item.org || '고객'}</td>
            
            <!-- ② 연락처 전화기 아이콘 완전 삭제 -->
            <td class="py-4 px-4 font-semibold text-blue-600 font-urbanist select-all">${contactVal}</td>
            
            <td class="py-4 px-4">${fileDisplayHtml}</td>
            <td class="py-4 px-4 text-slate-700 leading-relaxed max-w-xs break-words">${item.inquiry || '-'}</td>
            
            <!-- ③ 통화 배지 삭제 / 견적작성 단독 배치 -->
            <td class="py-4 px-4 text-center">
              <button onclick="openQuoteModal('${item.org || ''}', '${contactVal}', '${item.spec || ''}')" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition shadow-xs cursor-pointer">
                <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
                <span>견적작성</span>
              </button>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

    function showEmptyState(msg) {
      const tbody = document.getElementById('inquiry-table-body');
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-12 text-center text-slate-400 font-medium">${msg}</td></tr>`;
      }
    }

    function handleSearch(keyword) {
      const q = (keyword || '').toLowerCase().trim();
      if (!q) {
        renderTable(allInquiries);
        return;
      }
      const filtered = allInquiries.filter(item => {
        return (item.org && item.org.toLowerCase().includes(q)) ||
               (item.phone && item.phone.toLowerCase().includes(q)) ||
               (item.email && item.email.toLowerCase().includes(q)) ||
               (item.file_name && item.file_name.toLowerCase().includes(q)) ||
               (item.inquiry && item.inquiry.toLowerCase().includes(q));
      });
      renderTable(filtered);
    }

    function openQuoteModal(org, contact, spec) {
      document.getElementById('modal-recipient').value = `${org} (${contact})`;
      document.getElementById('modal-spec').value = spec || '표준 사양';
      document.getElementById('modal-quote-content').value = `[청년인쇄사 견적 안내]\n수신: ${org} 귀하\n사양: ${spec || '요청 규격'}\n\n상기 사양에 대한 제작 견적 금액 및 납기 일정을 안내해 드립니다.\n- 견적가: 원 (VAT 별도)\n- 납기: 확정일로부터 0일 소요`;
      document.getElementById('quote-modal').classList.remove('hidden');
    }

    function closeQuoteModal() {
      document.getElementById('quote-modal').classList.add('hidden');
    }

    function copyQuoteToClipboard() {
      const text = document.getElementById('modal-quote-content').value;
      navigator.clipboard.writeText(text).then(() => {
        alert('견적 회신 텍스트가 클립보드에 복사되었습니다.');
        closeQuoteModal();
      });
    }

    window.addEventListener('DOMContentLoaded', fetchInquiries);
  </script>
</body>
</html>
