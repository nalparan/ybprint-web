<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>청년인쇄사 관리자 센터</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700;900&family=Urbanist:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #F2F4F6;
      color: #191F28;
      letter-spacing: -0.02em;
    }
    .font-mono-code { font-family: 'Fira Code', monospace; }
    .font-urbanist { font-family: 'Urbanist', sans-serif; }
    .table-row-hover:hover { background-color: #F8FAFC; }
    
    @keyframes liveDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
    .live-indicator { animation: liveDot 2s infinite ease-in-out; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F2F4F6; }
    ::-webkit-scrollbar-thumb { background: #D1D6DB; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #B0B8C1; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- 🌐 상단 네비게이션 바 (모바일 글자 겹침 완벽 방지) -->
  <header class="bg-white/95 backdrop-blur-md border-b border-[#E5E8EB] px-4 sm:px-[5vw] py-3.5 sm:py-0 sm:h-20 flex items-center justify-between sticky top-0 z-40 shadow-xs">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-tr from-[#3182F6] to-[#60A5FA] flex items-center justify-center text-white font-black text-sm sm:text-base shadow-md shadow-blue-500/20 font-urbanist shrink-0">
        YB
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-extrabold text-base sm:text-xl text-[#191F28] tracking-tight">청년인쇄사</h1>
          <span class="text-[10px] sm:text-[11px] font-mono-code font-bold bg-[#E8F3FF] text-[#1B64DA] border border-[#BBDDFF] px-2 py-0.5 rounded-full">ADMIN</span>
        </div>
        <p class="text-[11px] sm:text-[13px] text-[#8B95A1] font-medium truncate max-w-[180px] sm:max-w-none">실시간 견적 문의 현황판</p>
      </div>
    </div>

    <!-- 액션 버튼 영역 -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <div class="hidden lg:flex items-center gap-2 bg-[#F2F4F6] border border-[#E5E8EB] px-3.5 py-1.5 rounded-xl">
        <span class="w-2.5 h-2.5 rounded-full bg-[#00B46B] live-indicator shadow-[0_0_8px_#00B46B]"></span>
        <span class="text-xs font-mono-code font-bold text-[#4E5968]" id="server-status-label">Render Live</span>
      </div>
      
      <a href="/" class="flex items-center gap-1 px-3 py-2 sm:px-4 sm:py-2 bg-white hover:bg-[#F2F4F6] text-[#4E5968] hover:text-[#191F28] rounded-xl text-xs sm:text-sm font-bold border border-[#E5E8EB] transition-all cursor-pointer shadow-xs">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-[#8B95A1]"></i>
        <span class="hidden xs:inline">홈</span>
      </a>

      <button onclick="fetchInquiries()" class="flex items-center gap-1.5 px-3 py-2 sm:px-4 sm:py-2 bg-[#3182F6] hover:bg-[#1B64DA] text-white rounded-xl text-xs sm:text-sm font-bold shadow-md shadow-blue-600/20 transition-all active:scale-95 cursor-pointer">
        <i data-lucide="refresh-cw" id="refresh-icon" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
        <span>새로고침</span>
      </button>
    </div>
  </header>

  <!-- 📊 메인 대시보드 컨테이너 -->
  <main class="flex-1 w-full px-4 sm:px-[5vw] py-5 sm:py-8 space-y-5 sm:space-y-7">
    
    <!-- 📈 상단 지표 카드 -->
    <div class="grid grid-cols-3 gap-2.5 sm:gap-5">
      <!-- 01. 오늘 접수 -->
      <div class="bg-white border border-[#E5E8EB] rounded-2xl sm:rounded-3xl p-3.5 sm:p-6 shadow-xs">
        <div class="flex items-center justify-between text-[#8B95A1] mb-1.5 sm:mb-3">
          <span class="text-[11px] sm:text-[13px] font-bold tracking-tight">오늘 접수</span>
          <div class="hidden sm:flex w-9 h-9 rounded-xl bg-[#E8F3FF] items-center justify-center">
            <i data-lucide="inbox" class="w-5 h-5 text-[#3182F6]"></i>
          </div>
        </div>
        <div class="flex items-baseline gap-1">
          <span class="text-xl sm:text-4xl font-extrabold text-[#191F28] font-urbanist" id="stat-today-count">0</span>
          <span class="text-xs sm:text-sm font-bold text-[#8B95A1]">건</span>
        </div>
      </div>

      <!-- 02. 원고 첨부 -->
      <div class="bg-white border border-[#E5E8EB] rounded-2xl sm:rounded-3xl p-3.5 sm:p-6 shadow-xs">
        <div class="flex items-center justify-between text-[#8B95A1] mb-1.5 sm:mb-3">
          <span class="text-[11px] sm:text-[13px] font-bold tracking-tight">원고 첨부</span>
          <div class="hidden sm:flex w-9 h-9 rounded-xl bg-[#E8F8F0] items-center justify-center">
            <i data-lucide="file-check-2" class="w-5 h-5 text-[#00B46B]"></i>
          </div>
        </div>
        <div class="flex items-baseline gap-1">
          <span class="text-xl sm:text-4xl font-extrabold text-[#00B46B] font-urbanist" id="stat-file-count">0</span>
          <span class="text-xs sm:text-sm font-bold text-[#8B95A1]">건</span>
        </div>
      </div>

      <!-- 03. 클라우드 서버 -->
      <div class="bg-white border border-[#E5E8EB] rounded-2xl sm:rounded-3xl p-3.5 sm:p-6 shadow-xs">
        <div class="flex items-center justify-between text-[#8B95A1] mb-1.5 sm:mb-3">
          <span class="text-[11px] sm:text-[13px] font-bold tracking-tight">서버 상태</span>
          <div class="hidden sm:flex w-9 h-9 rounded-xl bg-[#F4ECFF] items-center justify-center">
            <i data-lucide="server" class="w-5 h-5 text-[#8B5CF6]"></i>
          </div>
        </div>
        <div class="flex items-center gap-1.5 pt-0.5">
          <span class="w-2 h-2 rounded-full bg-[#00B46B] live-indicator"></span>
          <span class="text-xs sm:text-sm font-bold text-[#00B46B]">정상 가동</span>
        </div>
      </div>
    </div>

    <!-- 📋 접수 내역 메인 카드 (토스 서랍장 스타일) -->
    <div class="bg-white border border-[#E5E8EB] rounded-2xl sm:rounded-3xl overflow-hidden shadow-xs w-full">
      
      <!-- 상단 툴바 & 검색 -->
      <div class="p-4 sm:p-7 border-b border-[#E5E8EB] flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 sm:gap-4">
        <div class="flex items-center justify-between">
          <h2 class="text-base sm:text-xl font-extrabold text-[#191F28] flex items-center gap-2.5">
            <span>접수 내역</span>
            <span class="text-xs font-mono-code font-bold bg-[#E8F3FF] text-[#1B64DA] px-2.5 py-0.5 rounded-full border border-[#BBDDFF]" id="total-badge">0건</span>
          </h2>
        </div>

        <div class="relative w-full sm:w-80">
          <i data-lucide="search" class="w-4 h-4 text-[#8B95A1] absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="search-input" oninput="filterInquiries()" placeholder="소속, 연락처, 원고명 검색..." class="w-full bg-[#F2F4F6] border border-[#E5E8EB] rounded-xl sm:rounded-2xl pl-9 pr-4 py-2 text-xs sm:text-sm text-[#191F28] placeholder-[#8B95A1] focus:outline-none focus:bg-white focus:border-[#3182F6] transition-all font-medium" />
        </div>
      </div>

      <!-- 📱 [모바일 전용 뷰: md 미만] 토스형 피드 카드 리스트 (원고 & 문의내용 100% 노출) -->
      <div id="mobile-card-container" class="md:hidden divide-y divide-[#E5E8EB] p-3 space-y-3">
        <div class="py-12 text-center text-[#8B95A1] flex flex-col items-center justify-center gap-2">
          <i data-lucide="loader-2" class="w-6 h-6 text-[#3182F6] animate-spin"></i>
          <span class="text-xs font-medium">접수 내역을 불러오고 있습니다...</span>
        </div>
      </div>

      <!-- 💻 [PC/태블릿 전용 뷰: md 이상] 고정 테이블 뷰 -->
      <div class="hidden md:block overflow-x-auto w-full">
        <table class="w-full text-left border-collapse table-fixed min-w-[1100px]">
          <thead>
            <tr class="bg-[#F9FAFB] text-[#6B7684] text-[13.5px] font-bold border-b border-[#E5E8EB] select-none">
              <th class="py-4 pl-6 pr-3 font-mono-code w-16 text-center">NO</th>
              <th class="py-4 px-4 w-36">접수 시간</th>
              <th class="py-4 px-5 w-48">소속 / 성함</th>
              <th class="py-4 px-4 w-44">연락처</th>
              <th class="py-4 px-5 w-[360px]">첨부 원고 / 규격</th>
              <th class="py-4 px-5 w-auto">문의 및 요청사항</th>
              <th class="py-4 pl-3 pr-7 text-center w-36">관리</th>
            </tr>
          </thead>
          <tbody id="inquiry-table-body" class="divide-y divide-[#E5E8EB] text-[#333D4B] text-[14px]">
            <tr>
              <td colspan="7" class="py-20 text-center text-[#8B95A1]">
                <div class="flex flex-col items-center justify-center gap-3">
                  <i data-lucide="loader-2" class="w-7 h-7 text-[#3182F6] animate-spin"></i>
                  <span class="text-sm font-semibold">서버에서 접수 내역을 불러오는 중입니다...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <!-- 🔍 상세 모달 (원문 전체 보기) -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white border border-[#E5E8EB] w-full max-w-lg rounded-3xl p-6 sm:p-7 shadow-2xl space-y-4 sm:space-y-5">
      <div class="flex items-center justify-between border-b border-[#E5E8EB] pb-3 sm:pb-4">
        <h3 class="font-extrabold text-base sm:text-lg text-[#191F28] flex items-center gap-2">
          <i data-lucide="file-text" class="w-5 h-5 text-[#3182F6]"></i>
          <span>접수 상세 내역</span>
        </h3>
        <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full hover:bg-[#F2F4F6] text-[#8B95A1] hover:text-[#191F28] flex items-center justify-center transition-colors">✕</button>
      </div>
      <div class="space-y-3.5 text-xs sm:text-sm">
        <div>
          <span class="text-[11px] sm:text-xs font-bold text-[#8B95A1] block mb-1">소속 및 연락처</span>
          <p id="modal-org-phone" class="font-bold text-[#191F28] text-sm sm:text-[15px] bg-[#F9FAFB] p-3 rounded-xl sm:rounded-2xl border border-[#E5E8EB]"></p>
        </div>
        <div>
          <span class="text-[11px] sm:text-xs font-bold text-[#8B95A1] block mb-1">첨부 원고 / 자동 검수 규격</span>
          <p id="modal-spec" class="text-[#333D4B] bg-[#F9FAFB] p-3 rounded-xl sm:rounded-2xl border border-[#E5E8EB] whitespace-pre-wrap font-medium"></p>
        </div>
        <div>
          <span class="text-[11px] sm:text-xs font-bold text-[#8B95A1] block mb-1">고객 문의 및 요청사항</span>
          <div id="modal-inquiry" class="text-[#191F28] bg-[#F9FAFB] p-3.5 sm:p-4 rounded-xl sm:rounded-2xl border border-[#E5E8EB] whitespace-pre-wrap leading-relaxed max-h-56 overflow-y-auto font-medium"></div>
        </div>
      </div>
      <div class="pt-2 flex justify-end">
        <button onclick="closeDetailModal()" class="w-full sm:w-auto px-6 py-2.5 bg-[#3182F6] hover:bg-[#1B64DA] text-white rounded-xl text-xs sm:text-sm font-bold shadow-md shadow-blue-600/20 transition-all cursor-pointer">확인</button>
      </div>
    </div>
  </div>

  <footer class="py-6 sm:py-8 border-t border-[#E5E8EB] text-center text-xs text-[#8B95A1] font-medium bg-white">
    2026 청년인쇄사 관리 시스템 • 24시간 실시간 클라우드 자동화
  </footer>

  <script>
    lucide.createIcons();

    const RENDER_BACKEND_URL = "https://ybprint-backend-1.onrender.com";
    let allInquiries = [];

    async function fetchInquiries() {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const response = await fetch(`${RENDER_BACKEND_URL}/inquiries`, {
          method: 'GET',
          mode: 'cors'
        });

        if (!response.ok) {
          throw new Error("HTTP error " + response.status);
        }

        const data = await response.json();
        allInquiries = Array.isArray(data) ? data : (data.inquiries || []);
        renderAllViews(allInquiries);
        updateStats(allInquiries);

        const statusLabel = document.getElementById('server-status-label');
        if (statusLabel) statusLabel.innerText = "Render Live";
      } catch (err) {
        console.error("Failed to fetch inquiries:", err);
        const statusLabel = document.getElementById('server-status-label');
        if (statusLabel) statusLabel.innerText = "Connecting...";
        
        if (allInquiries.length === 0) {
          const emptyHtml = `
            <div class="py-12 text-center text-[#6B7684] flex flex-col items-center justify-center gap-2">
              <i data-lucide="alert-circle" class="w-6 h-6 text-[#F04452]"></i>
              <span class="font-bold text-[#191F28] text-xs sm:text-sm">서버 연결 중입니다 (약 30초 소요)</span>
              <button onclick="fetchInquiries()" class="mt-1 px-3 py-1.5 bg-white hover:bg-[#F2F4F6] rounded-xl text-xs font-bold text-[#191F28] border border-[#E5E8EB]">다시 시도 ↺</button>
            </div>
          `;
          document.getElementById('mobile-card-container').innerHTML = emptyHtml;
          document.getElementById('inquiry-table-body').innerHTML = `<tr><td colspan="7">${emptyHtml}</td></tr>`;
          lucide.createIcons();
        }
      } finally {
        if (refreshIcon) {
          setTimeout(() => refreshIcon.classList.remove('animate-spin'), 600);
        }
      }
    }

    function renderAllViews(list) {
      renderMobileCards(list);
      renderDesktopTable(list);
    }

    // 📱 [모바일 뷰 렌더링] 토스 카드 피드 형태 (잘림 없이 전부 표시)
    function renderMobileCards(list) {
      const container = document.getElementById('mobile-card-container');
      const totalBadge = document.getElementById('total-badge');
      if (!container) return;

      if (!list || list.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center text-[#8B95A1] flex flex-col items-center justify-center gap-2">
            <div class="w-10 h-10 rounded-2xl bg-[#F2F4F6] flex items-center justify-center">
              <i data-lucide="inbox" class="w-5 h-5 text-[#B0B8C1]"></i>
            </div>
            <span class="font-bold text-[#333D4B] text-sm">접수된 견적 문의가 없습니다</span>
          </div>
        `;
        if (totalBadge) totalBadge.innerText = "0건";
        lucide.createIcons();
        return;
      }

      if (totalBadge) totalBadge.innerText = `${list.length}건`;

      const reversed = [...list].reverse();

      container.innerHTML = reversed.map((item, idx) => {
        const no = list.length - idx;
        const timeRaw = item.timestamp || item.created_at || item.time || "-";
        const org = item.org || item.name || "미입력";
        const phone = item.phone || "연락처 없음";
        const rawFile = item.file_name || item.filename || "";
        const spec = item.spec || "-";
        const inquiry = item.inquiry || "(작성 내용 없음)";
        const hasFile = rawFile && rawFile !== "첨부파일 없음";

        let fileChipsHtml = '';
        if (hasFile) {
          const files = rawFile.split(',').map(f => f.trim()).filter(Boolean);
          fileChipsHtml = files.map(fileName => {
            const fileUrl = `${RENDER_BACKEND_URL}/download/${encodeURIComponent(fileName)}`;
            return `
              <a href="${fileUrl}" target="_blank" download class="flex items-center justify-between text-[#1B64DA] font-bold bg-[#E8F3FF] border border-[#BBDDFF] px-3 py-2 rounded-xl text-xs active:bg-[#D5E9FF] transition-all" title="${fileName}">
                <div class="flex items-center gap-1.5 truncate">
                  <i data-lucide="file-text" class="w-3.5 h-3.5 text-[#3182F6] shrink-0"></i>
                  <span class="truncate">${fileName}</span>
                </div>
                <i data-lucide="download" class="w-3.5 h-3.5 text-[#3182F6] shrink-0 ml-1.5"></i>
              </a>
            `;
          }).join('');
        } else {
          fileChipsHtml = `<div class="text-xs text-[#8B95A1] flex items-center gap-1"><i data-lucide="file-minus" class="w-3.5 h-3.5"></i><span>첨부파일 없음</span></div>`;
        }

        const safeOrg = encodeURIComponent(org);
        const safePhone = encodeURIComponent(phone);
        const safeSpec = encodeURIComponent(spec);
        const safeInquiry = encodeURIComponent(inquiry);

        return `
          <div class="bg-[#F9FAFB] border border-[#E5E8EB] rounded-2xl p-4 space-y-3 text-left">
            <!-- 카드 헤더: NO & 접수 시간 -->
            <div class="flex items-center justify-between border-b border-[#E5E8EB] pb-2.5">
              <span class="text-xs font-mono-code font-bold text-[#1B64DA] bg-blue-100/60 px-2 py-0.5 rounded-md">NO.${String(no).padStart(2, '0')}</span>
              <span class="text-xs font-mono-code text-[#8B95A1]">${timeRaw}</span>
            </div>

            <!-- 고객 정보 & 전화 바로걸기 -->
            <div class="flex items-center justify-between gap-2">
              <div>
                <span class="text-[11px] font-bold text-[#8B95A1] block">소속 / 성함</span>
                <span class="text-sm font-extrabold text-[#191F28]">${org}</span>
              </div>
              <a href="tel:${phone.replace(/[^0-9]/g, '')}" class="inline-flex items-center gap-1 px-3 py-1.5 bg-[#E8F8F0] active:bg-[#D3F5E4] text-[#008A50] rounded-xl text-xs font-bold border border-[#B7F0D4]">
                <i data-lucide="phone-call" class="w-3 h-3 text-[#00B46B]"></i>
                <span>${phone}</span>
              </a>
            </div>

            <!-- 📎 첨부 원고 리스트 -->
            <div class="space-y-1.5">
              <span class="text-[11px] font-bold text-[#8B95A1] block">첨부 원고</span>
              <div class="space-y-1">
                ${fileChipsHtml}
              </div>
              ${spec && spec !== '-' ? `<div class="text-[11px] text-[#6B7684] bg-white p-2 rounded-lg border border-[#E5E8EB] mt-1">${spec}</div>` : ''}
            </div>

            <!-- 💬 문의 내용 -->
            <div onclick="openDetailModal('${safeOrg}', '${safePhone}', '${safeSpec}', '${safeInquiry}')" class="bg-white p-3 rounded-xl border border-[#E5E8EB] active:bg-slate-50 transition-all cursor-pointer">
              <div class="flex items-center justify-between mb-1">
                <span class="text-[11px] font-bold text-[#8B95A1]">문의 및 요청사항</span>
                <span class="text-[10px] font-bold text-[#3182F6] flex items-center gap-0.5">상세보기 <i data-lucide="chevron-right" class="w-3 h-3"></i></span>
              </div>
              <p class="text-xs text-[#333D4B] line-clamp-2 leading-relaxed font-medium">${inquiry}</p>
            </div>
          </div>
        `;
      }).join("");

      lucide.createIcons();
    }

    // 💻 [PC 데스크톱 뷰 렌더링]
    function renderDesktopTable(list) {
      const tbody = document.getElementById('inquiry-table-body');
      if (!tbody) return;

      if (!list || list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-20 text-center text-[#8B95A1]">
              <div class="flex flex-col items-center justify-center gap-2.5">
                <div class="w-12 h-12 rounded-2xl bg-[#F2F4F6] flex items-center justify-center mb-1">
                  <i data-lucide="inbox" class="w-6 h-6 text-[#B0B8C1]"></i>
                </div>
                <span class="font-bold text-[#333D4B] text-[15px]">현재 접수된 견적 문의가 없습니다.</span>
              </div>
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      const reversed = [...list].reverse();

      tbody.innerHTML = reversed.map((item, idx) => {
        const no = list.length - idx;
        const timeRaw = item.timestamp || item.created_at || item.time || "-";
        const org = item.org || item.name || "-";
        const phone = item.phone || "-";
        const rawFile = item.file_name || item.filename || "";
        const spec = item.spec || "-";
        const inquiry = item.inquiry || "(작성 내용 없음)";
        const hasFile = rawFile && rawFile !== "첨부파일 없음";

        let timeHtml = '-';
        if (timeRaw && timeRaw !== '-') {
          const timeParts = timeRaw.split(' ');
          if (timeParts.length >= 2) {
            timeHtml = `
              <div class="flex flex-col">
                <span class="font-bold text-[#191F28] text-[13px] tracking-tight">${timeParts[0]}</span>
                <span class="text-[12px] font-mono-code font-semibold text-[#8B95A1]">${timeParts[1]}</span>
              </div>
            `;
          } else {
            timeHtml = `<span class="font-mono-code text-[13px] font-semibold text-[#4E5968]">${timeRaw}</span>`;
          }
        }

        let fileChipsHtml = '';
        if (hasFile) {
          const files = rawFile.split(',').map(f => f.trim()).filter(Boolean);
          fileChipsHtml = files.map(fileName => {
            const fileUrl = `${RENDER_BACKEND_URL}/download/${encodeURIComponent(fileName)}`;
            return `
              <a href="${fileUrl}" target="_blank" download class="inline-flex items-center gap-1.5 max-w-full text-[#1B64DA] hover:text-[#191F28] font-bold bg-[#E8F3FF] hover:bg-[#D5E9FF] border border-[#BBDDFF] px-3 py-1.5 rounded-xl transition-all group cursor-pointer shadow-2xs" title="${fileName}">
                <i data-lucide="file-text" class="w-4 h-4 shrink-0 text-[#3182F6]"></i>
                <span class="truncate text-[13px]">${fileName}</span>
                <i data-lucide="download" class="w-3.5 h-3.5 shrink-0 text-[#8B95A1] group-hover:text-[#1B64DA]"></i>
              </a>
            `;
          }).join('');
        } else {
          fileChipsHtml = `<div class="inline-flex items-center gap-1.5 text-[#8B95A1] text-[13px]"><i data-lucide="file-minus" class="w-4 h-4 shrink-0"></i><span>첨부파일 없음</span></div>`;
        }

        const safeOrg = encodeURIComponent(org);
        const safePhone = encodeURIComponent(phone);
        const safeSpec = encodeURIComponent(spec);
        const safeInquiry = encodeURIComponent(inquiry);

        return `
          <tr class="table-row-hover transition-colors align-middle">
            <td class="py-5 pl-6 pr-3 font-mono-code font-bold text-[#8B95A1] text-center text-[13px]">${String(no).padStart(2, '0')}</td>
            <td class="py-5 px-4 whitespace-nowrap">${timeHtml}</td>
            <td class="py-5 px-5 font-bold text-[#191F28] text-[15px] truncate" title="${org}">${org}</td>
            <td class="py-5 px-4 font-mono-code text-[#1B64DA] font-bold whitespace-nowrap text-[14px]">
              <a href="tel:${phone.replace(/[^0-9]/g, '')}" class="hover:underline flex items-center gap-1.5">
                <i data-lucide="phone" class="w-3.5 h-3.5 text-[#3182F6] shrink-0"></i>
                <span>${phone}</span>
              </a>
            </td>
            <td class="py-5 px-5">
              <div class="space-y-2 flex flex-col items-start max-w-[340px]">
                ${fileChipsHtml}
                ${spec && spec !== '-' ? `<div class="text-[12px] font-semibold text-[#6B7684] bg-[#F2F4F6] px-2.5 py-1 rounded-lg border border-[#E5E8EB] w-full truncate" title="${spec}">${spec}</div>` : ''}
              </div>
            </td>
            <td class="py-5 px-5 text-[#333D4B]">
              <div onclick="openDetailModal('${safeOrg}', '${safePhone}', '${safeSpec}', '${safeInquiry}')" class="bg-[#F9FAFB] hover:bg-white p-3 rounded-2xl border border-[#E5E8EB] hover:border-[#3182F6] hover:shadow-xs transition-all cursor-pointer group" title="클릭 시 전체 내용 보기">
                <p class="line-clamp-2 leading-relaxed text-[13.5px] text-[#333D4B] group-hover:text-[#191F28] font-medium">${inquiry}</p>
                <div class="mt-1 flex items-center gap-1 text-[11px] text-[#3182F6] font-bold opacity-0 group-hover:opacity-100 transition-opacity">
                  <i data-lucide="maximize-2" class="w-3 h-3"></i>
                  <span>상세보기</span>
                </div>
              </div>
            </td>
            <td class="py-5 pl-3 pr-7 text-center whitespace-nowrap">
              <a href="tel:${phone.replace(/[^0-9]/g, '')}" class="inline-flex items-center justify-center gap-1.5 px-3.5 py-2.5 bg-[#E8F8F0] hover:bg-[#D3F5E4] text-[#008A50] hover:text-[#006C3E] rounded-xl text-[13px] font-extrabold border border-[#B7F0D4] transition-all whitespace-nowrap shadow-2xs">
                <i data-lucide="phone-call" class="w-3.5 h-3.5 text-[#00B46B] shrink-0"></i>
                <span>전화상담</span>
              </a>
            </td>
          </tr>
        `;
      }).join("");

      lucide.createIcons();
    }

    function openDetailModal(org, phone, spec, inquiry) {
      document.getElementById('modal-org-phone').innerText = `${decodeURIComponent(org)} (${decodeURIComponent(phone)})`;
      document.getElementById('modal-spec').innerText = decodeURIComponent(spec);
      document.getElementById('modal-inquiry').innerText = decodeURIComponent(inquiry);
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function filterInquiries() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      if (!q) {
        renderAllViews(allInquiries);
        return;
      }
      const filtered = allInquiries.filter(item => {
        const str = `${item.org || ''} ${item.phone || ''} ${item.file_name || ''} ${item.inquiry || ''} ${item.spec || ''}`.toLowerCase();
        return str.includes(q);
      });
      renderAllViews(filtered);
    }

    function updateStats(list) {
      const todayCountEl = document.getElementById('stat-today-count');
      const fileCountEl = document.getElementById('stat-file-count');
      if (!list) return;

      if (todayCountEl) todayCountEl.innerText = list.length;
      
      const fileInquiries = list.filter(item => item.file_name && item.file_name !== "첨부파일 없음");
      if (fileCountEl) fileCountEl.innerText = fileInquiries.length;
    }

    fetchInquiries();
    setInterval(fetchInquiries, 15000);
  </script>
</body>
</html>
